name: ci 

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

      - "**/**"
  
      - "!README.md"
      - "!**/README.md"
      - "!docs/**"

  push:
    branches:
      - '**'
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

      - "**/**"

      - "!README.md"
      - "!**/README.md"
      - "!docs/**"

  workflow_dispatch:
  
permissions:
  packages: write
  contents: write

# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  # Only cancel in-progress jobs or runs for the current workflow - matches against branch & tags
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The publish job skips a tag that already exists, so a package edited without
  # a tag bump is silently never published. Catch it at review time.
  # INTERIM: delete this job when release-please owns the tag (Phase 2).
  tag-must-move:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.body, '[no-publish]')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: A changed package must bump its tag
        run: |
          set -uo pipefail
          git fetch -q --depth=1 origin "${{ github.base_ref }}"
          mapfile -t CHANGED < <(git diff --name-only FETCH_HEAD...HEAD)
          bash .github/scripts/tag-must-move.sh FETCH_HEAD "${CHANGED[@]:-}"
  get-package-oci-prefix:
    runs-on: ubuntu-latest
    outputs:
      oci_package_prefix: ${{ steps.prefix.outputs.oci_package_prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get OCI package prefix
        id: prefix
        uses: ./.github/actions/oci-package-prefix
        with:
          values_path: sandbox-dependencies-values.yaml

  kubocd-packages-ci:
    needs: [get-package-oci-prefix]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/kubocd-package-template.yml
    with:
      ci_registry: "ghcr.io"
      registry: "quay.io"
      publish_to_registry: "false"
      oci_package_prefix: "${{ needs.get-package-oci-prefix.outputs.oci_package_prefix }}"
      runs-on: "ubuntu-latest"
