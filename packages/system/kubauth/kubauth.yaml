# Identity provider behind the /api/v1/identity routes. Not applied by default,
# its Release lives under clusters/sandbox/optional/.
#
# The ingress class is hardcoded to nginx, and networkPolicies and
# hostNetworkCidr are parameters: the platform Context carries none of the three.
# The LDAP provider and the merger are left out, they need a .Context.ldap block
# nothing publishes.

apiVersion: v1alpha1
name: kubauth
tag: 0.3.0-snapshot-p03
protected: false
description: |
  Kubauth, a Kubernetes-native OIDC provider. Users, groups and OIDC clients are custom resources,
  which is what lets the Control Plane manage identity through the API server.
usage:
  text: |
    Kubauth answers at {{ if .Parameters.oidcServerTls }}https{{ else }}http{{ end }}://{{ .Parameters.oidcIngressHost }}.{{ .Context.ingress.suffix }}
    Create the first administrator before signing in, see optional/kubauth/README.
schema:
  parameters:
    properties:
      oidcIngressHost: { type: string, default: "kubauth", title: "Server | Ingress host | | order:1 columns:2", description: "Host name, the platform ingress suffix is appended." }
      oidcServerTls: { type: boolean, default: true, title: "Server | TLS | | order:2" }
      oidcIngressAnnotations:
        type: object
        title: "Server | Ingress annotations | | order:3 advanced:true"
        properties: {}
        additionalProperties: true
      networkPolicies: { type: boolean, default: false, title: "Server | Network policies | | order:4 advanced:true", description: "Restrict traffic to the kubauth pods." }
      hostNetworkCidr: { type: string, default: "", title: "Server | Host network CIDR | | order:5 advanced:true", description: "Only needed on a multi-node kind cluster." }
      allowPasswordGrant: { type: boolean, default: false, title: "Authentication | Allow password grant | | order:1 advanced:true" }
      enforcePKCE: { type: boolean, default: false, title: "Authentication | Enforce PKCE | | order:2 advanced:true" }
      ssoSticky: { type: boolean, default: false, title: "Authentication | Sticky SSO | | order:3 advanced:true" }
      clientsNamespace: { type: string, default: "kubauth-oidc", title: "Clients | Namespace | | order:1 columns:2" }
      usersNamespace: { type: string, default: "kubauth-users", title: "Users | Namespace | | order:1 columns:2" }
      usersCreateNamespace: { type: boolean, default: true, title: "Users | Create namespace | | order:2" }
      auditEnabled: { type: boolean, default: true, title: "Users | Audit trail | | order:3" }
      logLevel: { type: string, default: "info", enum: ["error", "info", "debug", "trace"], title: "Server | Log level | | order:6 advanced:true" }
      logMode: { type: string, default: "text", enum: ["text", "json"], title: "Server | Log format | | order:7 advanced:true" }
  context:
    properties:
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            required: true
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/kubauth/charts/kubauth
        tag: "0.3.0-snapshot"
    values: |
      {{- $kubauthHost := printf "%s.%s" .Parameters.oidcIngressHost .Context.ingress.suffix -}}
      networkPolicies:
        enabled: {{ .Parameters.networkPolicies }}
        forWebhooks: true
        {{- with .Parameters.hostNetworkCidr }}
        ipBlock: {{ . }}
        {{- end }}

      oidc:
        enabled: true
        image:
          repository: quay.io/kubauth/exec/kubauth
        logger:
          mode: {{ .Parameters.logMode }}
          level: {{ .Parameters.logLevel }}
        server:
          certificateIssuer: {{ .Context.certificateIssuers.selfSigned.name }}
          tls: {{ .Parameters.oidcServerTls }}
        ingress:
          host: {{ $kubauthHost }}
          class: {{ .Context.ingress.className }}
          passthrough: false
          annotations:
            {{- toYaml (.Parameters.oidcIngressAnnotations | default dict) | nindent 8 }}
        postLogoutURL: {{ if .Parameters.oidcServerTls }}https{{ else }}http{{ end }}://{{ $kubauthHost }}/index
        issuer: {{ if .Parameters.oidcServerTls }}https{{ else }}http{{ end }}://{{ $kubauthHost }}
        sso:
          cleanupPeriod: 5m
          sticky: {{ .Parameters.ssoSticky }}
        allowPasswordGrant: {{ .Parameters.allowPasswordGrant }}
        enforcePKCE: {{ .Parameters.enforcePKCE }}
        clientPrivilegedNamespace: {{ .Parameters.clientsNamespace }}
        idProvider:
          {{- if .Parameters.auditEnabled }}
          baseURL: http://localhost:6805
          {{- else }}
          baseURL: http://localhost:6802
          {{- end }}

      audit:
        enabled: {{ .Parameters.auditEnabled }}
        image:
          repository: quay.io/kubauth/exec/kubauth
        logger:
          mode: {{ .Parameters.logMode }}
          level: {{ .Parameters.logLevel }}
        idProvider:
          baseURL: http://localhost:6802

      merger:
        enabled: false

      ucrd:
        enabled: true
        image:
          repository: quay.io/kubauth/exec/kubauth
        namespace: {{ .Parameters.usersNamespace }}
        createNamespace: {{ .Parameters.usersCreateNamespace }}
        logger:
          mode: {{ .Parameters.logMode }}
          level: {{ .Parameters.logLevel }}

      ldap:
        enabled: false
roles:
  - oidc-server
dependencies:
  - ingress
  - certManager
