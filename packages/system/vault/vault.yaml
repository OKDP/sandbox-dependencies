# The ingress class is hardcoded to nginx: the platform Context carries no
# ingress.className.

apiVersion: v1alpha1
name: vault
tag: 0.29.1-p03
protected: true
description: |
  HashiCorp Vault, the secret backend a SecretStore points at. Runs in dev mode by default,
  which unseals itself and keeps everything in memory.
usage:
  text: |
    Vault is reachable at https://{{ .Parameters.ingressHost }}.{{ .Context.ingress.suffix }}
    In dev mode the root token is "root" and the store is emptied on every restart.
schema:
  parameters:
    properties:
      dev: { type: boolean, default: true, title: "Server | Development mode | | order:1" }
      ingressHost: { type: string, default: "vault", title: "Server | Ingress host | | order:2 columns:2", description: "Host name, the platform ingress suffix is appended." }
      uiEnabled: { type: boolean, default: true, title: "Server | Web UI | | order:3" }
  context:
    properties:
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            required: true
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
modules:
  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://helm.releases.hashicorp.com
        chart: vault
        version: "0.29.1"
    values: |
      {{- $vaultHost := printf "%s.%s" .Parameters.ingressHost .Context.ingress.suffix -}}
      server:
        dev:
          enabled: {{ .Parameters.dev }}
        ingress:
          enabled: true
          ingressClassName: {{ .Context.ingress.className }}
          annotations:
            cert-manager.io/cluster-issuer: {{ .Context.certificateIssuers.selfSigned.name }}
          hosts:
            - host: {{ $vaultHost }}
              paths: []
          tls:
            - secretName: vault-tls
              hosts:
                - {{ $vaultHost }}
      ui:
        enabled: {{ .Parameters.uiEnabled }}
roles: []
# The ingress admission webhook must answer before the Ingress is created.
dependencies:
  - ingress
