# Carries the CRDs the Control Plane's secret-store and external-secret routes
# probe for. Without them both route groups answer 501.

apiVersion: v1alpha1
name: external-secrets
tag: 2.12.0-1.0.1
protected: true
description: |
  External Secrets Operator synchronizes secrets from external APIs (HashiCorp Vault, AWS Secrets
  Manager, and others) into Kubernetes Secrets.
usage:
  text: |
    The operator watches SecretStore and ExternalSecret resources in every namespace.
    The Control Plane exposes both under a project once a SecretStore points at a backend.
schema:
  parameters:
    properties:
      installCRDs: { type: boolean, default: true, title: "Install | CRDs | | order:1" }
      webhookEnabled: { type: boolean, default: true, title: "Install | Webhook | | order:2", description: "Install the webhook that validates SecretStore and ExternalSecret resources." }
      certControllerEnabled: { type: boolean, default: true, title: "Install | Certificate controller | | order:3" }
      serveV1Beta1: { type: boolean, default: false, title: "Install | Serve v1beta1 | | order:4", description: "Keep serving the deprecated external-secrets.io/v1beta1 API, for clients not yet moved to v1. Temporary: the chart flag behind it is deprecated." }
      imageRepository: { type: string, default: "ghcr.io/external-secrets/external-secrets", title: "Image | Repository | | order:5", description: "Set a mirror here if ghcr.io is not reachable." }
  context:
    properties: {}
modules:
  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://charts.external-secrets.io
        chart: external-secrets
        version: "2.12.0"
    values: |
      installCRDs: {{ .Parameters.installCRDs }}
      crds:
        unsafeServeV1Beta1: {{ .Parameters.serveV1Beta1 }}
      # The chart carries three separate image blocks, one per deployment.
      image:
        repository: {{ .Parameters.imageRepository | quote }}
      webhook:
        create: {{ .Parameters.webhookEnabled }}
        image:
          repository: {{ .Parameters.imageRepository | quote }}
      certController:
        create: {{ .Parameters.certControllerEnabled }}
        image:
          repository: {{ .Parameters.imageRepository | quote }}
# Same role as local-secrets-provider: the two are alternatives, one backed by
# the operator, the other a local stand-in, and the packages depending on
# external-secrets take whichever the platform installed.
roles:
  - external-secrets
dependencies: []
