# Carries the CRDs the Control Plane's secret-store and external-secret routes
# probe for. Without them both route groups answer 501.

apiVersion: v1alpha1
name: external-secrets
tag: 0.15.1-p01
protected: true
description: |
  External Secrets Operator synchronizes secrets from external APIs (HashiCorp Vault, AWS Secrets
  Manager, and others) into Kubernetes Secrets.
usage:
  text: |
    The operator watches SecretStore and ExternalSecret resources in every namespace.
    The Control Plane exposes both under a project once a SecretStore points at a backend.
schema:
  parameters:
    properties:
      installCRDs: { type: boolean, default: true, title: "Install | CRDs | | order:1" }
      webhookEnabled: { type: boolean, default: true, title: "Install | Webhook | | order:2" }
      certControllerEnabled: { type: boolean, default: true, title: "Install | Certificate controller | | order:3" }
  context:
    properties: {}
modules:
  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://charts.external-secrets.io
        chart: external-secrets
        version: "0.15.1"
    values: |
      installCRDs: {{ .Parameters.installCRDs }}
      webhook:
        create: {{ .Parameters.webhookEnabled }}
      certController:
        create: {{ .Parameters.certControllerEnabled }}
# Same role as local-secrets-provider: the two are alternatives, one backed by
# the operator, the other a local stand-in, and the packages depending on
# external-secrets take whichever the platform installed.
roles:
  - external-secrets
dependencies: []
