# Carries the CRDs the Control Plane's secret-store and external-secret routes
# probe for. Without them both route groups answer 501.

apiVersion: v1alpha1
name: external-secrets
tag: 1.0.0 # x-release-please-version
protected: true
description: |
  External Secrets Operator synchronizes secrets from external APIs (HashiCorp Vault, AWS Secrets
  Manager, and others) into Kubernetes Secrets.
usage:
  text: |
    The operator watches SecretStore and ExternalSecret resources in every namespace.
    The Control Plane exposes both under a project once a SecretStore points at a backend.
schema:
  parameters:
    properties:
      installCRDs: { type: boolean, default: true, title: "Install | CRDs | | order:1" }
      webhookEnabled: { type: boolean, default: true, title: "Install | Webhook | | order:2", description: "Install the webhook service and keep the CRD conversion webhook. Off, the CRDs drop their conversion webhook as well." }
      certControllerEnabled: { type: boolean, default: true, title: "Install | Certificate controller | | order:3" }
      imageRepository: { type: string, default: "ghcr.io/external-secrets/external-secrets", title: "Image | Repository | | order:4", description: "The chart defaults to oci.external-secrets.io, a mirror some corporate proxies do not allow. ghcr.io carries the same releases." }
  context:
    properties: {}
modules:
  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://charts.external-secrets.io
        chart: external-secrets
        version: "0.15.1"
    values: |
      installCRDs: {{ .Parameters.installCRDs }}
      # crds.conversion.enabled must follow webhook.create. A CRD left with
      # conversion.strategy Webhook and no service behind it makes the API
      # server retry against a missing endpoint on every conversion.
      crds:
        conversion:
          enabled: {{ .Parameters.webhookEnabled }}
      # The chart carries three separate image blocks, one per deployment.
      image:
        repository: {{ .Parameters.imageRepository | quote }}
      webhook:
        create: {{ .Parameters.webhookEnabled }}
        image:
          repository: {{ .Parameters.imageRepository | quote }}
      certController:
        create: {{ .Parameters.certControllerEnabled }}
        image:
          repository: {{ .Parameters.imageRepository | quote }}
# Same role as local-secrets-provider: the two are alternatives, one backed by
# the operator, the other a local stand-in, and the packages depending on
# external-secrets take whichever the platform installed.
roles:
  - external-secrets
dependencies: []
