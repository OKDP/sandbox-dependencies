# Unified Connections wiring: the logical databases are received as the
# 'databases' parameter (formerly .Context.defaultDatabaseServer.settings.databases)
# and the package outputs one database-server Connection per database, with the
# owner passwordSecret published as secretRef.
apiVersion: v1alpha1
name: cnpg-postgresql
tag: 18.3-p03
protected: false
description: |
  Defines multiple logical PostgreSQL databases managed by the CloudNativePG operator within a single PostgreSQL
  instance (cluster) and includes ownership, access credentials, and lifecycle management through Kubernetes-native CRDs.
usage:
  text: |
    Databases instances used in the sandbox
schema:
  parameters:
    properties:
      databases:
        type: array
        items:
          properties:
            name: { type: string, required: true }
            # Required: the published Connection carries the owner's Secret,
            # so a database without one has nothing to hand to a consumer.
            owner:
              required: true
              properties:
                username: { type: string, required: true }
                # Owner credentials Secret (keys: username, password), also
                # published as secretRef of the database Connection.
                passwordSecret: { type: string, required: true }
            schemas:
              type: array
              items: { type: string }
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/cnpg-postgresql
        tag: 0.1.0
    values: |
      replicaCount: 1
      fullnameOverride: {{ .Release.metadata.name }}

      image:
        repository: ghcr.io/cloudnative-pg/postgresql
        pullPolicy: IfNotPresent
        tag: 18.3

      storage:
        size: 2Gi
        class: standard

      databases:
      {{ toYaml .Parameters.databases | indent 4 }}
# One database-server Connection per logical database, named kcd-<release>-<db>.
outputs: |
  {{- range .Parameters.databases }}
  - name: "{{ .name }}"
    contract: database-server
    values:
      engine: postgresql
      driver: org.postgresql.Driver
      host: "{{ $.Release.metadata.name }}-rw.{{ $.Release.spec.targetNamespace }}.svc.cluster.local"
      port: 5432
      dbName: "{{ .name }}"
      secretRef: "{{ .owner.passwordSecret }}"
  {{- end }}
roles:
  - database-server
dependencies:
  - pg-operator
  - external-secrets
