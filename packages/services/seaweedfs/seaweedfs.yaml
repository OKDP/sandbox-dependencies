apiVersion: v1alpha1
name: seaweedfs
tag: 4.17.0-p4
protected: false
description: |
  SeaweedFS is a simple and highly scalable distributed file system. There are the objectives to store billions of files and to serve the files fast!
usage:
  text: |
    SeaweedFS is a simple and highly scalable distributed file system.
    Access the console at {{ .Context.defaultStorage.provider.endpoints.consoleUrl 
       | replace "{{ .Release.namespace }}" .Release.spec.targetNamespace 
       | replace "{{ .Release.metadata.name }}" .Release.metadata.name 
       | replace "{{ .Context.ingress.suffix }}" .Context.platform.ingress.suffix }}
schema:
  parameters:
    properties:
      username: { type: string, required: true, default: "admin" }
      password: { type: string, required: true, default: "admin123" }
      rootAccessKey: { type: string, required: true, default: "okdpadmin", minLength: 3, maxLength: 20 }
      rootSecretKey: { type: string, required: true, default: "okdp-seaweedfs-root-change-me", minLength: 8, maxLength: 40 }
      stsRoleArn: { type: string, required: true, default: "arn:aws:iam::000000000000:role/S3WriteRole" }
      volumeReplicas: { type: integer, required: true, default: 1 }
      masterStorage: { type: string, required: true, default: "1" }
      masterLogStorage: { type: string, required: true, default: "0.5" }
      volumeStorage: { type: string, required: true, default: "2" }
      filerStorage: { type: string, required: true, default: "0.5" }
      filerLogStorage: { type: string, required: true, default: "0.5" }
  context:
    properties:
      platform:
        required: true
        properties:
          certificateIssuers:
            required: true
            properties:
              selfSigned:
                properties:
                  name: { type: string, required: true }
          storageClass:
            required: true
            properties:
              data: { type: string, required: true }
              workspace: { type: string, required: true }
          ingress:
            required: true
            properties:
              suffix: { type: string, required: true }
modules:
  - name: auth-config
    source:
      oci:
        repository: quay.io/okdp/charts/seaweedfs-auth-config
        tag: 1.1.0
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.platform.ingress.suffix -}}
      
      {{- $storage := .Context.defaultStorage -}}
      {{- $s3ConfigSecret := printf "%s-s3-config" $release -}}
      {{- $stsEnabled := false -}}
      {{- range $g := ($storage.grants | default list) }}
        {{- if $g.sts }}{{- $stsEnabled = true }}{{- end }}
      {{- end }}

      # Pin the chart fullname so the generated IAM ConfigMap has a deterministic
      # name, independent of Helm's fullname dedup (wich depends on the release name)
      fullnameOverride: {{ $release }}-auth-config 

      iamConfig:
        sts:
          tokenDuration: "1h"
          maxSessionLength: "12h"
          issuer: "seaweedfs-sts"
          signingKey: ""
      
        # -- IAM policies to define in the SeaweedFS IAM config.
        policies:
          - name: "S3WritePolicy"
            document:
              Version: "2012-10-17"
              Statement:
                - Effect: "Allow"
                  Action: ["s3:List*","s3:Get*","s3:Put*","s3:DeleteObject"]
                  Resource: ["*"]
        
        # -- IAM roles to define in the SeaweedFS IAM config.
        roles:
          - roleName: "S3WriteRole"
            roleArn: "{{ .Parameters.stsRoleArn }}"
            attachedPolicies: ["S3WritePolicy"]
            trustPolicy:
              Version: "2012-10-17"
              Statement:
                # Polaris uses Credentials-based STS AssumeRole
                - Effect: "Allow"
                  Principal: "*"
                  Action:
                    - "sts:AssumeRole"
      
      s3Config:
        enabled: true
        secretName: {{ $s3ConfigSecret }}
        identities:
          # SeaweedFS only authorizes sts:AssumeRole for an Admin identity.
          - name: seaweedfs
            credentials:
              accessKey: {{ .Parameters.rootAccessKey | quote }}
              secretKey: {{ .Parameters.rootSecretKey | quote }}
            actions: ["Admin"]
          {{- range $g := ($storage.grants | default list) }}
          {{- $buckets := ($g.buckets | default list) }}
          {{- $actions := list }}
          {{- range $a := ($g.actions | default list) }}
          {{- $verb := title $a }}
          {{- if eq $verb "Admin" }}
          {{- $actions = append $actions "Admin" }}
          {{- else if $buckets }}
          {{- range $b := $buckets }}{{- $actions = append $actions (printf "%s:%s" $verb $b) }}{{- end }}
          {{- else }}
          {{- $actions = append $actions $verb }}
          {{- end }}
          {{- end }}
          {{- if $g.sts }}
          {{- $actions = append $actions "Admin" }}
          {{- end }}
          - name: {{ $g.principal | quote }}
            credentialsSecret:
              name: {{ $g.credentialsSecret.name | quote }}
              accessKeyKey: {{ $g.credentialsSecret.accessKeyKey | quote }}
              secretKeyKey: {{ $g.credentialsSecret.secretKeyKey | quote }}
            actions: {{ $actions | uniq | toJson }}
          {{- end }}

      filer:
        auth:
          method: basic
          basic:
            create_auth_secret: creds-seaweedfs-filer-basic
            username: {{ .Parameters.username }}
            password: {{ .Parameters.password }}

  - name: main
    dependsOn:
      - auth-config
    timeout: 10m
    source:
      helmRepository:
        url: https://seaweedfs.github.io/seaweedfs/helm
        chart: seaweedfs
        version: 4.17.0
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.platform.ingress.suffix -}}

      {{- $storage := .Context.defaultStorage -}}
      {{- $s3ConfigSecret := printf "%s-s3-config" $release -}}
      {{- $stsEnabled := false -}}
      {{- range $g := ($storage.grants | default list) }}
        {{- if $g.sts }}{{- $stsEnabled = true }}{{- end }}
      {{- end }}

      {{- $seaweedfsS3Url := .Context.defaultStorage.provider.endpoints.apiUrl
         | replace "{{ .Release.namespace }}" $namespace
         | replace "{{ .Release.metadata.name }}" $release
         | replace "{{ .Context.ingress.suffix }}" $domain -}}
      
      {{- $seaweedfsFilerUrl := .Context.defaultStorage.provider.endpoints.consoleUrl 
         | replace "{{ .Release.namespace }}" $namespace
         | replace "{{ .Release.metadata.name }}" $release
         | replace "{{ .Context.ingress.suffix }}" $domain -}}
      
      {{- $seaweedfsS3Host := regexReplaceAll "^https?://" $seaweedfsS3Url "" -}}
      {{- $seaweedfsFilerHost := regexReplaceAll "^https?://" $seaweedfsFilerUrl "" -}}
      
      nameOverride: "{{ .Release.metadata.name }}"
      fullnameOverride: "{{ .Release.metadata.name }}"

      global:
        imageName: chrislusf/seaweedfs
      
      image:
        tag: "4.17"

      master:
        enabled: true
        replicas: 1
        data:
          type: "persistentVolumeClaim"
          storageClass: "{{ .Context.platform.storageClass.workspace }}"
          size: "{{ .Parameters.masterStorage }}Gi"

        logs:
          type: "persistentVolumeClaim"
          storageClass: "{{ .Context.platform.storageClass.workspace }}"
          size: "{{ .Parameters.masterLogStorage }}Gi"
      
      volume:
        enabled: true
        replicas: {{ .Parameters.volumeReplicas }}
        dataDirs:
          - name: data
            type: "persistentVolumeClaim"
            storageClass: "{{ .Context.platform.storageClass.workspace }}"
            size: "{{ .Parameters.volumeStorage }}Gi"
            maxVolumes: 0

      filer:
        enabled: true
        replicas: 1
        enablePVC: true
        port: 8888
        data:
          type: "persistentVolumeClaim"
          storageClass: "{{ .Context.platform.storageClass.workspace }}"
          size: "{{ .Parameters.filerStorage }}Gi"
        logs:
          type: "persistentVolumeClaim"
          storageClass: "{{ .Context.platform.storageClass.workspace }}"
          size: "{{ .Parameters.filerLogStorage }}Gi"
        ingress:
          enabled: true
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "130m"
            cert-manager.io/cluster-issuer: "{{ .Context.platform.certificateIssuers.selfSigned.name }}"
            nginx.ingress.kubernetes.io/auth-type: basic
            nginx.ingress.kubernetes.io/auth-secret: creds-seaweedfs-filer-basic
            nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
          host: {{ $seaweedfsFilerHost }}
          path: "/"
          pathType: Prefix
          tls:
            - secretName: seaweedfs-filer-tls
              hosts:
                - {{ $seaweedfsFilerHost }}
      
      s3:
        enabled: true
        enableAuth: true
        existingConfigSecret: {{ $s3ConfigSecret }}
        createBuckets:
          {{- range $b := ($storage.buckets | default list) }}
          - name: {{ $b.name | quote }}
            anonymousRead: {{ $b.anonymousRead | default false }}
          {{- end }}

        extraVolumes: |
          - name: auth-config
            configMap:
              name: {{ .Release.metadata.name }}-auth-config
  
        extraVolumeMounts: |
          - name: auth-config
            mountPath: /etc/seaweed/iam
            readOnly: true
        {{- if $stsEnabled }}
        extraArgs:
          - "-iam.config=/etc/seaweed/iam/iam.json"
        {{- end }}
      
        ingress:
          enabled: true
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "130m"
            cert-manager.io/cluster-issuer: "{{ .Context.platform.certificateIssuers.selfSigned.name }}"
          host: {{ $seaweedfsS3Host }}
          path: "/"
          pathType: Prefix
          tls:
            - secretName: seaweedfs-s3-tls
              hosts:
              - {{ $seaweedfsS3Host }}

  # Seeds defaultStorage.buckets[].paths for consumers that require their prefix to
  # exist beforehand (Spark's FsHistoryProvider refuses to start otherwise).
  - name: provisioning
    dependsOn:
      - main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/seaweedfs-provisioning
        tag: 1.0.0
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $storage := .Context.defaultStorage -}}

      fullnameOverride: {{ $release }}-provisioning

      endpoint: http://{{ $release }}-s3.{{ $namespace }}:8333

      credentials:
        accessKey: {{ .Parameters.rootAccessKey | quote }}
        secretKey: {{ .Parameters.rootSecretKey | quote }}

      buckets:
        {{- range $b := ($storage.buckets | default list) }}
        {{- if $b.paths }}
        - name: {{ $b.name | quote }}
          paths: {{ $b.paths | toJson }}
        {{- end }}
        {{- end }}

roles:
  - storage
dependencies:
  - ingress
  # - database-server
